<!DOCTYPE html>
<html lang="bs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Moja Aplikacija{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    {% block css %}
    {% endblock %}
</head>
<body>
    <!-- header -->
    <header>
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="/">Moja Aplikacija</a>
                <div class="navbar-nav">
                    <a class="nav-link" href="/">Početna</a>
                    <a class="nav-link" href="/about">O nama</a>
                </div>
            </div>
        </nav>
    </header>

    <main class="container my-4">
        <!-- blok izmedu kojeg se postavlaj u drugim stranicama kod stranice -->
        {% block content %}
        {% endblock %}
    </main>

    <!-- ja bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    {% block scripts %}
    {% endblock %}


    <!-- footer -->
    <footer class="bg-light py-3">
        <div class="container">
            <p class="text-center">&copy; 2023 Moja Aplikacija. Sva prava pridržana.</p>
        </div>
    </footer>
</body>
</html>
